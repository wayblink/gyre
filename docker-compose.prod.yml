# Gyre —— 生产部署 compose (阿里云 ECS)，置于 Caddy 反代之后。
# 项目名 gyre：容器/卷/网络前缀都会是 gyre_*。
# 启动：
#   docker network create web                     # 仅一次
#   AUTH_BOOTSTRAP_SECRET=<强口令> docker compose -f docker-compose.prod.yml up -d --build
name: gyre

services:
  postgres:
    image: postgres:16
    container_name: gyre-postgres
    environment:
      POSTGRES_USER: captable
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-captable}
      POSTGRES_DB: captable
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U captable -d captable"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    container_name: gyre
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: "60628"
      DATABASE_URL: postgres://captable:${POSTGRES_PASSWORD:-captable}@postgres:5432/captable
      STORAGE_DRIVER: local
      # 登录开关：false=启用账号密码登录（生产默认）; true=免登录
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      # 必须显式设置；空库首次创建管理员时 /api/auth/bootstrap 必须携带该口令。
      AUTH_BOOTSTRAP_SECRET: ${AUTH_BOOTSTRAP_SECRET:?AUTH_BOOTSTRAP_SECRET must be set}
      # Caddy/HTTPS 部署默认只通过 Secure Cookie 传递登录会话。
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      # 内置 workflow/operator 元数据与全局参数默认保留，确保工作流定义与参数可用。
      WORKFLOW_SEED_ON_INIT: ${WORKFLOW_SEED_ON_INIT:-true}
    volumes:
      # 持久化本地存储（上传件 / product files 写在 /app/data 下）
      - appdata:/app/data
    networks:
      # 与 postgres 通信用的内部网
      default: {}
      # 共享反代网：Caddy 通过别名 gyre-app 转发到本服务
      web:
        aliases: [gyre-app]
    restart: unless-stopped

networks:
  # 由 `docker network create web` 预先创建，两个项目 + Caddy 共用
  web:
    external: true

volumes:
  pgdata:
  appdata:
