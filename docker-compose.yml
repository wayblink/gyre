services:
  postgres:
    image: postgres:16-alpine
    container_name: gyre-captable-postgres
    environment:
      POSTGRES_DB: captable
      POSTGRES_USER: captable
      POSTGRES_PASSWORD: captable
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - gyre-captable-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U captable -d captable"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    container_name: gyre-captable-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-29000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-29001}:9001"
    volumes:
      - gyre-captable-minio:/data

volumes:
  gyre-captable-postgres:
    name: captable-0618_gyre-captable-postgres
    external: true
  gyre-captable-minio:
